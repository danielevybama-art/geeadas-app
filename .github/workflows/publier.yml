name: Publier le site

on:
  push:
    paths:
      - 'geead-abidjan-sud.zip'
      - 'geead-abidjan-sud.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remplacer les fichiers du site
        run: |
          if [ -f geead-abidjan-sud.zip ]; then A=geead-abidjan-sud.zip
          elif [ -f geead-abidjan-sud.tar.xz ]; then A=geead-abidjan-sud.tar.xz
          else echo "Aucune archive à publier"; exit 0; fi
          rm -rf geeadas-site && mkdir geeadas-site
          case "$A" in
            *.zip) unzip -q "$A" -d geeadas-site ;;
            *) tar -xJf "$A" -C geeadas-site ;;
          esac
          rm "$A"

      - name: Compléter les icônes de l'application
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          d = 'geeadas-site/assets'
          logo = Image.open(os.path.join(d, 'logo.png')).convert('RGBA')
          def icone(nom, taille, largeur):
              chemin = os.path.join(d, nom)
              if os.path.exists(chemin):
                  return
              largeur = min(largeur, logo.width)
              hauteur = round(logo.height * largeur / logo.width)
              img = logo.resize((largeur, hauteur), Image.LANCZOS)
              fond = Image.new('RGBA', (taille, taille), (255, 255, 255, 255))
              fond.alpha_composite(img, ((taille - largeur) // 2, (taille - hauteur) // 2))
              fond.convert('RGB').save(chemin, optimize=True)
          icone('icon-512.png', 512, 400)
          icone('maskable-512.png', 512, 320)
          icone('icon-192.png', 192, 165)
          icone('apple-touch-icon.png', 180, 151)
          icone('favicon.png', 64, 58)
          PY
          ls -la geeadas-site geeadas-site/assets

      - name: Enregistrer la nouvelle version
        run: |
          git config user.name "GEEAD ABIDJAN SUD"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mise en ligne de la nouvelle version du site" || echo "Aucun changement"
          git push
